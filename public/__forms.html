<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Netlify Forms Handler</title>
</head>
<body>
  <!-- Netlify Form Detection for Next.js Static Export -->
  <form name="tu-van" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="tu-van" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="company" />
    <input type="text" name="service" />
    <textarea name="message"></textarea>
    <input type="text" name="source" />
    <input type="text" name="submittedAt" />
  </form>
</body>
</html>
